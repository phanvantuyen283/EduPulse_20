<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPulse 20 - Trung Tâm Điều Hành</title>
    <!-- Nhúng CSS dùng chung -->
    <link rel="stylesheet" href="style.css">
    <!-- Thư viện SheetJS để xuất Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        .admin-container { max-width: 1000px; padding: 20px; width: 100%; margin: 0 auto; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #d4af37; padding-bottom: 15px; }
        .panel { background-color: #121212; border: 1px solid #2d3748; border-radius: 12px; padding: 25px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .panel h2 { color: #d9e8fd; margin-bottom: 20px; font-size: 1.2rem; border-bottom: 1px dashed #2d3748; padding-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;}
        .json-editor { width: 100%; height: 300px; background: #001d2e; color: #a0aec0; font-family: monospace; font-size: 14px; padding: 15px; border-radius: 8px; border: 1px solid #2d3748; outline: none; resize: vertical; margin-bottom: 15px; line-height: 1.5; }
        .json-editor:focus { border-color: #d4af37; color: #eceff4; }
        .table-wrapper { overflow-x: auto; border-radius: 8px; border: 1px solid #2d3748; }
        table { width: 100%; border-collapse: collapse; background: #1a2634; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #2d3748; }
        th { background-color: #001d2e; color: #d4af37; font-weight: 700; white-space: nowrap; }
        tr:hover { background-color: #202e40; }
        .flex-group { display: flex; gap: 15px; align-items: flex-end; margin-bottom: 15px; flex-wrap: wrap; }
        .btn-excel { background: linear-gradient(135deg, #28a745, #218838); color: white; width: auto; }
    </style>
</head>
<body>

<div class="admin-container">
    <div class="admin-header">
        <h1 class="app-title" style="margin:0; font-size: 1.8rem;">Trung Tâm Điều Hành</h1>
        <button class="primary-btn" style="width: auto; padding: 10px 20px; margin: 0;" onclick="window.location.href='index.html'">Trở về Cổng trường</button>
    </div>

    <!-- KHỐI 1: BẬT/TẮT MÔN HỌC -->
    <div class="panel">
        <h2>1. Trạng thái môn học (menu.html)</h2>
        <div class="flex-group" style="align-items: center; margin-bottom: 0;">
            <label style="cursor: pointer;"><input type="checkbox" id="toggle-toan" style="accent-color: #d4af37;"> Toán</label>
            <label style="cursor: pointer;"><input type="checkbox" id="toggle-tv" style="accent-color: #d4af37;"> Tiếng Việt</label>
            <label style="cursor: pointer;"><input type="checkbox" id="toggle-ta" style="accent-color: #d4af37;"> Tiếng Anh</label>
            <button class="primary-btn" id="btn-save-mon" style="width: auto; padding: 8px 20px; margin-left: 20px;">Lưu Cấu Hình</button>
            <span id="msg-mon" style="color: #48bb78; display: none;">✔ Đã lưu</span>
        </div>
    </div>

    <!-- KHỐI 2: NẠP ĐỀ THI ĐỘNG (JSON) -->
    <div class="panel">
        <h2>2. Nạp đề thi AI (Ngân Hàng Đề)</h2>
        <div class="flex-group">
            <div>
                <label style="color:#a0aec0; display:block; margin-bottom:5px;">Chọn môn cần nạp:</label>
                <select id="select-mon-nap" class="input-control">
                    <option value="toan">Môn Toán</option>
                    <option value="tieng_viet">Môn Tiếng Việt</option>
                    <option value="tieng_anh">Môn Tiếng Anh</option>
                </select>
            </div>
            <button class="secondary-btn" id="btn-load-json" style="width: auto; padding: 14px 20px;">Tải đề đang có xem thử</button>
        </div>
        
        <textarea id="json-input" class="json-editor" placeholder="Dán mã JSON do AI tạo vào đây..."></textarea>
        
        <button class="primary-btn" id="btn-save-json" style="width: 200px;">Lưu Lên Đám Mây</button>
        <p id="json-msg" style="margin-top: 10px; font-weight: bold; display: none;"></p>
    </div>

    <!-- KHỐI 3: QUẢN LÝ HỌC SINH (MÃ PIN) -->
    <div class="panel">
        <h2>3. Cấp lại Mã PIN</h2>
        <div class="flex-group">
            <div>
                <label style="color:#a0aec0; display:block; margin-bottom:5px;">Lớp</label>
                <select id="admin-class" class="input-control"><option value="4B1">4B1</option><option value="4B2">4B2</option></select>
            </div>
            <div>
                <label style="color:#a0aec0; display:block; margin-bottom:5px;">Tên Học Sinh</label>
                <select id="admin-student" class="input-control"><option>Đang tải...</option></select>
            </div>
            <div>
                <label style="color:#a0aec0; display:block; margin-bottom:5px;">Mã PIN mới</label>
                <input type="text" id="admin-new-pin" class="input-control" placeholder="Ví dụ: 1234">
            </div>
            <button class="primary-btn" id="btn-reset-pin" style="width: 120px;">Đổi PIN</button>
        </div>
    </div>

    <!-- KHỐI 4: BẢNG ĐIỂM & XUẤT EXCEL -->
    <div class="panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 style="margin: 0; border: none; padding: 0;">4. Kết Quả Học Tập</h2>
            <button class="primary-btn btn-excel" id="btn-export-excel">📥 Xuất File Excel</button>
        </div>
        
        <div class="table-wrapper">
            <table>
                <thead><tr><th>Thời gian</th><th>Lớp</th><th>Học sinh</th><th>Môn học</th><th>Điểm số</th><th>Đánh giá</th></tr></thead>
                <tbody id="results-body">
                    <tr><td colspan="6" style="text-align: center; color: #a0aec0;">Đang tải dữ liệu...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc, setDoc, collection, getDocs, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDgPsOLRCLmzQAbC2eI0QX8gXLF7FicIzk",
        authDomain: "edupulse-20.firebaseapp.com",
        projectId: "edupulse-20"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 1. CẤU HÌNH MÔN HỌC
    const docRefMon = doc(db, "cau_hinh", "trang_thai_mon");
    
    getDoc(docRefMon).then(snap => {
        if (snap.exists()) {
            const data = snap.data();
            document.getElementById("toggle-toan").checked = data.toan ?? true;
            document.getElementById("toggle-tv").checked = data.tiengViet ?? true;
            document.getElementById("toggle-ta").checked = data.tiengAnh ?? true;
        }
    }).catch(err => console.error("Lỗi tải cấu hình:", err));

    document.getElementById("btn-save-mon").addEventListener("click", async () => {
        await updateDoc(docRefMon, {
            toan: document.getElementById("toggle-toan").checked,
            tiengViet: document.getElementById("toggle-tv").checked,
            tiengAnh: document.getElementById("toggle-ta").checked
        });
        const msg = document.getElementById("msg-mon");
        msg.style.display = "inline"; 
        setTimeout(() => msg.style.display = "none", 3000);
    });

    // 2. NẠP ĐỀ THI JSON
    const jsonInput = document.getElementById('json-input');
    const msgJson = document.getElementById('json-msg');

    document.getElementById('btn-load-json').addEventListener('click', async () => {
        const mon = document.getElementById('select-mon-nap').value;
        const snap = await getDoc(doc(db, "ngan_hang_de", mon));
        if (snap.exists()) {
            jsonInput.value = JSON.stringify(snap.data(), null, 4);
        } else {
            jsonInput.value = "Chưa có dữ liệu cho môn này.";
        }
    });

    document.getElementById('btn-save-json').addEventListener('click', async () => {
        const mon = document.getElementById('select-mon-nap').value;
        const rawData = jsonInput.value.trim();
        
        if (!rawData) return alert("Vui lòng dán mã JSON vào ô!");

        try {
            const parsedData = JSON.parse(rawData);
            await setDoc(doc(db, "ngan_hang_de", mon), parsedData);
            
            msgJson.style.color = "#48bb78";
            msgJson.innerText = `✔ Đã nạp thành công đề thi cho môn: ${mon.toUpperCase()}`;
            msgJson.style.display = "block";
            setTimeout(() => msgJson.style.display = "none", 4000);
        } catch (error) {
            msgJson.style.color = "#ff6b6b";
            msgJson.innerText = "❌ Lỗi: Mã JSON không hợp lệ! Vui lòng kiểm tra lại dấu ngoặc hoặc dấu phẩy.";
            msgJson.style.display = "block";
        }
    });

    // 3. QUẢN LÝ MÃ PIN
    async function loadDS(lop) {
        const selectHs = document.getElementById("admin-student");
        selectHs.innerHTML = "<option>Đang tải...</option>";
        
        try {
            const q = query(collection(db, "hoc_sinh"), where("lop", "==", lop));
            const snap = await getDocs(q);
            
            let html = "";
            snap.forEach(docSnap => {
                const data = docSnap.data();
                html += `<option value="${docSnap.id}">${data.hoTen} (PIN: ${data.pin})</option>`;
            });
            selectHs.innerHTML = html || "<option value=''>Không có học sinh</option>";
        } catch (err) {
            selectHs.innerHTML = "<option value=''>Lỗi nạp danh sách học sinh</option>";
        }
    }
    
    document.getElementById("admin-class").addEventListener("change", (e) => loadDS(e.target.value));
    loadDS("4B1");

    document.getElementById("btn-reset-pin").addEventListener("click", async () => {
        const docId = document.getElementById("admin-student").value;
        const selectHsText = document.getElementById("admin-student").selectedOptions[0]?.text || "";
        const pinMoi = document.getElementById("admin-new-pin").value.trim();

        if (!docId) return alert("Vui lòng chọn học sinh!");
        if (!pinMoi) return alert("Vui lòng nhập PIN mới!");
        
        await updateDoc(doc(db, "hoc_sinh", docId), { pin: pinMoi });
        alert(`Thành công! Đã đổi mã PIN của ${selectHsText.split(' (PIN:')[0]} thành: ${pinMoi}`);
        document.getElementById("admin-new-pin").value = "";
        loadDS(document.getElementById("admin-class").value);
    });

    // 4. BẢNG ĐIỂM & XUẤT EXCEL
    let duLieuExcel = [];

    async function loadKetQua() {
        const tbody = document.getElementById("results-body");
        try {
            const q = query(collection(db, "ket_qua_hoc_tap"), orderBy("thoiGianNop", "desc"));
            const snap = await getDocs(q);
            tbody.innerHTML = "";
            duLieuExcel = [];

            snap.forEach(docSnap => {
                const data = docSnap.data();
                const timeStr = data.thoiGianNop ? data.thoiGianNop.toDate().toLocaleString('vi-VN') : "Vừa xong";
                const monTen = (data.monHoc || '').toUpperCase();

                tbody.innerHTML += `
                    <tr>
                        <td style="color:#a0aec0; font-size:0.9rem;">${timeStr}</td>
                        <td>${data.lop || '-'}</td>
                        <td style="color:#d4af37; font-weight:700;">${data.hocSinh || '-'}</td>
                        <td>${monTen}</td>
                        <td style="font-weight:700;">${data.diemSo ?? 0}/${data.tongSoCau ?? 0}</td>
                        <td style="font-size:0.85rem; color:#a0aec0;">Đã ghi log ${data.chiTietLamBai?.length || 0} câu</td>
                    </tr>
                `;

                duLieuExcel.push({
                    "Ngày giờ": timeStr,
                    "Lớp": data.lop || '',
                    "Họ Tên": data.hocSinh || '',
                    "Môn Thi": monTen,
                    "Điểm Số": data.diemSo ?? 0,
                    "Tổng Câu": data.tongSoCau ?? 0
                });
            });
            
            if (snap.empty) tbody.innerHTML = "<tr><td colspan='6' style='text-align:center;'>Chưa có dữ liệu bài làm.</td></tr>";
        } catch (err) {
            tbody.innerHTML = "<tr><td colspan='6' style='text-align:center; color:#ff6b6b;'>Lỗi khi nạp dữ liệu từ máy chủ.</td></tr>";
        }
    }
    
    loadKetQua();

    document.getElementById("btn-export-excel").addEventListener("click", () => {
        if (duLieuExcel.length === 0) return alert("Không có dữ liệu để xuất!");
        const ws = XLSX.utils.json_to_sheet(duLieuExcel);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "BangDiem");
        XLSX.writeFile(wb, "EduPulse_BangDiem.xlsx");
    });
</script>
</body>
</html>

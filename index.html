<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPulse 20 - Trợ Lý AI Học Tập</title>
    <!-- Nhúng font chữ Nunito thân thiện cho học sinh tiểu học -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Liên kết file định dạng CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-screen" class="screen">
        <div class="login-box">
            <div class="logo">
                <h1>Edu<span>Pulse</span> 20</h1>
                <p>Trợ lý học tập thông minh lớp 4</p>
            </div>

            <!-- Bước 1: Chọn lớp -->
            <div class="input-group">
                <label for="class-select">1. Con học lớp nào?</label>
                <select id="class-select">
                    <option value="" disabled selected>-- Bấm để chọn lớp --</option>
                    <option value="4B1">Lớp 4B1</option>
                    <option value="4B2">Lớp 4B2</option>
                </select>
            </div>

            <!-- Bước 2: Chọn tên học sinh -->
            <div class="input-group">
                <label for="student-select">2. Tên của con là gì?</label>
                <select id="student-select" disabled>
                    <option value="" disabled selected>-- Vui lòng chọn lớp trước --</option>
                </select>
            </div>

            <!-- Bước 3: Nhập mã PIN -->
            <div class="input-group">
                <label for="password">3. Nhập mã PIN cá nhân:</label>
                <input type="password" id="password" placeholder="Nhập mã PIN của con..." maxlength="6" disabled>
            </div>

            <!-- Nút đăng nhập -->
            <button id="login-btn" class="primary-btn" disabled>Vào Lớp Học</button>
        </div>
    </div>

    <!-- MÀN HÌNH CHAT CHÍNH (Ẩn đi trước khi đăng nhập) -->
    <div id="main-screen" class="screen" style="display: none;">
        <header>
            <div class="user-info">
                <span id="display-name" class="name">Tên học sinh</span>
                <span id="display-class" class="badge">Lớp</span>
            </div>
            <button id="logout-btn">Đăng xuất</button>
        </header>

        <div class="chat-container">
            <!-- Khung chứa tin nhắn trò chuyện -->
            <div id="chat-box" class="chat-box">
                <div class="message ai-message">
                    <div class="avatar">🤖</div>
                    <div class="text">Chào con! Thầy là trợ lý AI của lớp mình. Con đang gặp khó khăn ở bài tập toán nào, hãy cứ hỏi thầy nhé!</div>
                </div>
            </div>

            <!-- Khu vực nhập câu hỏi -->
            <div class="input-area">
                <textarea id="user-input" placeholder="Nhập câu hỏi của con ở đây..." rows="1"></textarea>
                <button id="send-btn">Gửi</button>
            </div>
        </div>
    </div>

    <!-- Liên kết file logic JavaScript (Dạng module hỗ trợ Firebase) -->
    <script type="module" src="app.js"></script>
</body>
</html>

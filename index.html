<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPulse 20 - Cổng Lớp Học</title>
    <!-- Nhúng file CSS dùng chung -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container" id="login-section">
        <h1 class="app-title">EduPulse 20</h1>
        <p class="app-subtitle">Hệ thống Học tập Kiến tạo</p>
        
        <!-- Chọn Lớp -->
        <div class="input-group">
            <label for="student-class">Lớp của con</label>
            <select id="student-class" class="input-control">
                <option value="4B1">Lớp 4B1</option>
                <option value="4B2">Lớp 4B2</option>
            </select>
        </div>
        
        <!-- Chọn Họ và Tên từ Menu xổ xuống -->
        <div class="input-group">
            <label for="student-name">Họ và Tên của con</label>
            <select id="student-name" class="input-control">
                <option value="">-- Chọn tên của con --</option>
            </select>
        </div>

        <!-- Nhập Mã PIN (Bàn phím số) -->
        <div class="input-group">
            <label for="student-pin">Mã PIN bí mật</label>
            <input type="password" id="student-pin" class="input-control" placeholder="Nhập 4 số PIN (Mặc định: 1234)" inputmode="numeric" pattern="[0-9]*" maxlength="4">
        </div>

        <button id="login-btn" class="primary-btn">Vào Lớp Học</button>
        <p id="error-message" class="error-msg">Sai mã PIN hoặc con chưa chọn Tên nhé!</p>
    </div>

    <!-- Gọi file xử lý logic ES Module -->
    <script type="module" src="app.js"></script>

</body>
</html>
